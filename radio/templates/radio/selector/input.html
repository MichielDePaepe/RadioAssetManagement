<!-- radio/selector/input.html -->
{% load static i18n %}

<div class="mb-3">
  <div class="input-group">
    <input type="text" id="radio-issi" class="form-control" placeholder="{% trans 'ISSI' %}">
    <button type="button" class="btn btn-primary search-btn" id="search-issi-btn" data-type="issi">{% trans "Zoeken" %}</button>
  </div>
  <div class="form-text text-danger" id="error-issi"></div>
</div>

<div class="mb-3">
  <div class="input-group">
    <input type="text" id="radio-tei" class="form-control" placeholder="{% trans 'TEI' %}">
    <button type="button" class="btn btn-primary search-btn" id="search-tei-btn" data-type="tei">{% trans "Zoeken" %}</button>
  </div>
  <div class="form-text text-danger" id="error-tei"></div>
</div>

<div class="mb-3">
  <div class="input-group">
    <input type="text" id="radio-alias" class="form-control" placeholder="{% trans 'Alias' %}">
    <button type="button" class="btn btn-primary search-btn" id="search-alias-btn" data-type="alias">{% trans "Zoeken" %}</button>
  </div>
  <div class="form-text text-danger" id="error-alias"></div>
</div>

<div class="mb-3">
  <input type="text" id="radio-selector-scanner-input">
  <button type="button" class="btn btn-success w-100" id="scan-btn" data-type="qr">
    <i class="bi bi-qr-code"></i> {% trans "Start scanner" %}
  </button>
  <div class="form-text text-danger" id="error-qr"></div>
</div>
