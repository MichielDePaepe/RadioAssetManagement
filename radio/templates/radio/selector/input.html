<!-- radio/selector/input.html -->
{% load static i18n %}

<style>
  .radio-selector-shell {
    display: grid;
    gap: .75rem;
  }

  .radio-selector-query-row {
    display: flex;
    gap: .5rem;
    align-items: stretch;
  }

  .radio-selector-action-row {
    display: flex;
    gap: .5rem;
    justify-content: center;
    align-items: stretch;
  }

  #radio-selector-scanner-input {
    position: absolute;
    left: -9999px;
  }

  .radio-selector-icon-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  .radio-selector-action-btn {
    width: 4.5rem;
    height: 4.5rem;
    flex: 0 0 4.5rem;
    font-size: 1.65rem;
  }

  .radio-selector-search-btn {
    width: 3rem;
    flex: 0 0 3rem;
  }

  #radio-selector-query {
    min-height: 3rem;
  }

  .radio-selector-camera-mode .radio-selector-query-row,
  .radio-selector-camera-mode .radio-selector-action-row,
  .radio-selector-camera-mode #radio-selector-error {
    display: none !important;
  }

  #radio-selector-camera-video {
    aspect-ratio: 1 / 1;
    max-height: min(72vw, 360px);
    object-fit: cover;
    object-position: center center;
    background: #111;
  }

  #radio-selector-camera-viewport {
    position: relative;
    overflow: hidden;
    border-radius: var(--bs-border-radius);
    background: #111;
  }

  .qr-scan-frame {
    position: absolute;
    inset: 13%;
    pointer-events: none;
    box-shadow: 0 0 0 999px rgba(0, 0, 0, .2);
  }

  .qr-scan-frame span {
    position: absolute;
    width: 2rem;
    height: 2rem;
    border-color: var(--bs-primary);
    border-style: solid;
    border-width: 0;
    filter: drop-shadow(0 1px 2px rgba(0, 0, 0, .45));
  }

  .qr-scan-frame .top-left {
    top: 0; left: 0; border-top-width: 4px; border-left-width: 4px; border-top-left-radius: 1.1rem;
  }

  .qr-scan-frame .top-right {
    top: 0; right: 0; border-top-width: 4px; border-right-width: 4px; border-top-right-radius: 1.1rem;
  }

  .qr-scan-frame .bottom-left {
    bottom: 0; left: 0; border-bottom-width: 4px; border-left-width: 4px; border-bottom-left-radius: 1.1rem;
  }

  .qr-scan-frame .bottom-right {
    right: 0; bottom: 0; border-right-width: 4px; border-bottom-width: 4px; border-bottom-right-radius: 1.1rem;
  }

  .qr-camera-controls {
    position: absolute; right: .75rem; bottom: .75rem; z-index: 2; display: flex; gap: .5rem;
  }

  .qr-camera-control {
    display: flex; width: 5.25rem; height: 5.25rem; flex-direction: column; align-items: center;
    justify-content: center; gap: .1rem; border: 2px solid rgba(255, 255, 255, .15);
    border-radius: 1.25rem; background: rgba(35, 39, 38, .92); color: #fff; font-size: .85rem; line-height: 1.1;
  }

  .qr-camera-control i { font-size: 1.6rem; }
  .qr-camera-control .zoom-value { font-size: .8rem; opacity: .85; }
  .qr-camera-control:disabled { opacity: .55; }
  .qr-camera-control.is-on { border-color: var(--bs-primary); background: var(--bs-primary); color: #fff; }
</style>

<div class="radio-selector-shell">
  <div class="radio-selector-query-row">
    <input type="text"
           id="radio-selector-query"
           class="form-control"
           placeholder="{% trans 'TEI, ISSI of alias' %}"
           autocomplete="off"
           autocorrect="off"
           autocapitalize="off">
    <button type="button" class="btn btn-primary radio-selector-icon-btn radio-selector-search-btn" id="radio-selector-search-btn" title="{% trans 'Zoeken' %}">
      <i class="bi bi-search"></i>
    </button>
  </div>

  <div class="radio-selector-action-row">
    <input type="text" id="radio-selector-scanner-input">
    <button type="button" class="btn btn-outline-primary radio-selector-icon-btn radio-selector-action-btn" id="scan-btn" title="{% trans 'Handscanner' %}">
      <i class="bi bi-upc-scan"></i>
    </button>
    <span id="radio-selector-camera-controls" style="display:none;">
      <button type="button" class="btn btn-outline-primary radio-selector-icon-btn radio-selector-action-btn" id="camera-scan-btn" title="{% trans 'Camera' %}">
        <i class="bi bi-camera"></i>
      </button>
    </span>
  </div>

  <div id="radio-selector-camera-panel" style="display:none;">
    <div id="radio-selector-camera-viewport">
      <video id="radio-selector-camera-video"
             class="w-100 border rounded"
             muted
             playsinline></video>
      <div class="qr-scan-frame" aria-hidden="true">
        <span class="top-left"></span><span class="top-right"></span>
        <span class="bottom-left"></span><span class="bottom-right"></span>
      </div>
      <div class="qr-camera-controls">
        <button type="button" class="qr-camera-control" id="radio-selector-camera-zoom" title="{% trans 'Zoom aanpassen' %}" aria-label="{% trans 'Zoom aanpassen' %}">
          <i class="bi bi-zoom-in"></i><span class="zoom-value">1,3×</span>
        </button>
      </div>
    </div>
    <div class="d-flex gap-2 mt-2">
      <button type="button" class="btn btn-outline-secondary flex-fill" id="camera-stop-btn">
        <i class="bi bi-stop-circle me-1"></i>{% trans "Stop camera" %}
      </button>
      <button type="button" class="btn btn-outline-secondary flex-fill" id="radio-selector-camera-torch" title="{% trans 'Zaklamp wordt niet ondersteund door deze camera.' %}" aria-label="{% trans 'Zaklamp aanzetten' %}" aria-pressed="false" disabled>
        <i class="bi bi-lightning-charge-fill me-1"></i>{% trans "Zaklamp" %}
      </button>
    </div>
  </div>

  <div class="small text-danger d-none" id="radio-selector-error" role="alert"></div>
</div>
