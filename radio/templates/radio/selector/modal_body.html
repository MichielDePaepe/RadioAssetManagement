<!-- radio/selector/modal_body.html -->
{% load static i18n %}

{% csrf_token %}

<!-- STEP 1: Inputs -->
<div id="inputs">
  {% include "radio/selector/input.html" %}
</div>

<!-- STEP 2: Resultaat -->
<div id="result" class="mt-3" style="display:none;"></div>

<!-- Java Script -->
<script src="{% static 'js/scanner.js' %}"></script>
<script src="https://unpkg.com/@zxing/browser@0.2.1"></script>

<script>
// --- Scanner initialization ---
const scanner = new Scanner({
  inputId: "radio-selector-scanner-input",
  scanUrl: "{% url 'radio:scan' %}",
  onScan: handleScanResponse
});

// --- Determine if this is a modal or static card ---
const isStatic = {{ static|yesno:"true,false" }};
let containerElement = null; 
let modalElement = null;     
let autoConfirm = {{ auto_confirm|yesno:"true,false" }};

// --- Inputs / Results elements ---
const inputsDiv = document.getElementById("inputs");
const resultDiv = document.getElementById("result");

// --- Current button & callback ---
let currentButton = null;
let currentCallback = null;

document.addEventListener("DOMContentLoaded", function() {
{% if not static %}
  // Modal case
  modalElement = document.getElementById("radioSelectorModal");
  containerElement = modalElement;

  const bsInstance = new bootstrap.Modal(modalElement);

  if (modalElement.dataset.showOnLoad === "true") bsInstance.show();

  // Reset modal when shown/hidden
  modalElement.addEventListener('shown.bs.modal', () => { resetToInputs(); start_scanning(); });
  modalElement.addEventListener('hidden.bs.modal', () => { resertToInputs(); stop_scanning(); stopCameraScanning(); });

  // Handle buttons that open the selector
  document.querySelectorAll(".open-radio-selector-modal").forEach(btn => {
    btn.addEventListener("click", () => {
      const callbackName = btn.dataset.callback;
      if (callbackName && window[callbackName]) {
        currentCallback = window[callbackName];
      } else if (window.radio_selector_callback) {
        currentCallback = window.radio_selector_callback;
      } else {
        console.error("No callback function found");
        currentCallback = null;
      }
      currentButton = btn;
    });
  });
{% else %}
  // Static card case
  containerElement = document.getElementById("radioSelectorCard");
  callbackName = '{{ callback }}';
  if (callbackName && window[callbackName]) {
    currentCallback = window[callbackName];
  } else {
    console.error("No callback function found");
    currentCallback = null;
  }
  resetToInputs();
  start_scanning();
{% endif %}
});

// --- Reset function ---
function resetToInputs() {
  inputsDiv.style.display = "block";
  resultDiv.style.display = "none";
  resultDiv.innerHTML = "";
  document.getElementById("radio-selector-query").value = "";
  clearSelectorError();
  stopCameraScanning();
}

function resertToInputs() {
  resetToInputs();
}

// --- Handle manual search ---
const queryInput = document.getElementById("radio-selector-query");
const searchButton = document.getElementById("radio-selector-search-btn");
const errorDiv = document.getElementById("radio-selector-error");

function setSelectorError(message) {
  errorDiv.textContent = message;
  errorDiv.classList.toggle("d-none", !message);
}

function clearSelectorError() {
  setSelectorError("");
}

queryInput.addEventListener("focus", () => {
  stop_scanning();
  stopCameraScanning();
});

queryInput.addEventListener("keydown", e => {
  if (e.key === "Enter") {
    e.preventDefault();
    lookupRadio();
  }
});

searchButton.addEventListener("click", lookupRadio);

async function lookupRadio() {
  clearSelectorError();
  resultDiv.innerHTML = "";

  const value = queryInput.value.trim();
  if (!value) {
    setSelectorError("{% trans 'Vul een TEI, ISSI of alias in.' %}");
    return;
  }

  const formData = new FormData();
  formData.append("type", "auto");
  formData.append("value", value);

  const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;

  try {
    const res = await fetch("{% url 'radio:lookup' %}", {
      method: "POST",
      headers: { "X-CSRFToken": csrfToken },
      body: formData
    });
    const data = await res.json();

    if (data.status === "success" || data.status === "ok") {
      loadSelectorResult(data);
    } else {
      setSelectorError(data.message);
    }
  } catch (err) {
    setSelectorError("{% trans 'Er is een fout opgetreden bij het zoeken.' %}");
    console.error(err);
  }
}

// --- Scanner logic (on/off, QR handling) ---
function start_scanning() {
  const btn = document.getElementById("scan-btn");
  btn.classList.remove("btn-outline-primary");
  btn.classList.add("btn-danger");
  btn.innerHTML = '<i class="bi bi-upc-scan"></i>';
  btn.title = "{% trans 'Stop handscanner' %}";
  scanner.start();
}

function stop_scanning() {
  const btn = document.getElementById("scan-btn");
  if (!btn) return;
  btn.classList.remove("btn-danger");
  btn.classList.add("btn-outline-primary");
  btn.innerHTML = '<i class="bi bi-upc-scan"></i>';
  btn.title = "{% trans 'Handscanner' %}";
  scanner.stop();
}

document.getElementById("scan-btn").addEventListener("click", e => {
  if (!scanner.is_scanning) {
    stopCameraScanning();
    start_scanning();
  }
  else stop_scanning();
});

// --- Smartphone camera QR scanner ---
const cameraControlsWrapper = document.getElementById("radio-selector-camera-controls");
const cameraButton = document.getElementById("camera-scan-btn");
const cameraPanel = document.getElementById("radio-selector-camera-panel");
const cameraVideo = document.getElementById("radio-selector-camera-video");
const cameraStopButton = document.getElementById("camera-stop-btn");
const cameraTorchButton = document.getElementById("radio-selector-camera-torch");
let cameraReader = null;
let cameraControls = null;
let cameraStartToken = 0;
let cameraTorchEnabled = false;
let cameraResultPending = false;
let lastCameraValue = "";
let lastCameraValueAt = 0;

function isPhoneOrTablet() {
  const coarsePointer = window.matchMedia("(pointer: coarse)").matches;
  const userAgentPhoneOrTablet = /Android|iPhone|iPad|iPod|Windows Phone|Tablet/i.test(navigator.userAgent);
  const touchMacTablet = /Macintosh/i.test(navigator.userAgent) && navigator.maxTouchPoints > 1;
  return coarsePointer || userAgentPhoneOrTablet || touchMacTablet;
}

function canShowCameraScanner() {
  const debugEnabled = {{ debug|yesno:"true,false" }};
  return isPhoneOrTablet() || debugEnabled;
}

if (canShowCameraScanner()) {
  cameraControlsWrapper.style.display = "inline-flex";
}

cameraButton.addEventListener("click", startCameraScanning);
cameraStopButton.addEventListener("click", () => {
  stopCameraScanning();
});

async function startCameraScanning() {
  clearSelectorError();
  stop_scanning();

  if (!navigator.mediaDevices?.getUserMedia) {
    setSelectorError("{% trans 'Camera scannen wordt niet ondersteund door deze browser.' %}");
    return;
  }

  if (!window.ZXingBrowser?.BrowserQRCodeReader) {
    setSelectorError("{% trans 'QR-detectie met de camera wordt niet ondersteund door deze browser.' %}");
    return;
  }

  const startToken = ++cameraStartToken;
  try {
    cameraReader = new ZXingBrowser.BrowserQRCodeReader();
    cameraPanel.closest(".radio-selector-shell")?.classList.add("radio-selector-camera-mode");
    cameraPanel.style.display = "block";
    cameraButton.style.display = "none";
    cameraControls = await cameraReader.decodeFromConstraints({
      video: { facingMode: { ideal: "environment" } },
      audio: false
    }, cameraVideo, (result, error) => {
      if (!result || cameraResultPending) return;
      const scannedLine = result.getText();
      const now = Date.now();
      if (scannedLine === lastCameraValue && now - lastCameraValueAt <= 2000) return;
      lastCameraValue = scannedLine;
      lastCameraValueAt = now;
      cameraResultPending = true;
      submitScannedLine(scannedLine)
        .then(data => {
          if (data.status === "ok" || data.status === "success") {
            stopCameraScanning();
            handleScanResponse(data);
          } else {
            setSelectorError(data.message);
          }
        })
        .catch(err => {
          console.error(err);
          setSelectorError("{% trans 'Scan kon niet verwerkt worden.' %}");
        })
        .finally(() => {
          cameraResultPending = false;
        });
    });
    if (startToken !== cameraStartToken) {
      cameraControls.stop();
      cameraControls = null;
      return;
    }
    cameraTorchButton.disabled = typeof cameraControls.switchTorch !== "function";
  } catch (err) {
    setSelectorError("{% trans 'Camera kon niet gestart worden.' %}");
    console.error(err);
    stopCameraScanning();
  }
}

function stopCameraScanning() {
  cameraStartToken += 1;
  if (cameraControls) cameraControls.stop();
  cameraControls = null;
  cameraReader = null;
  cameraTorchEnabled = false;
  cameraResultPending = false;
  cameraTorchButton.disabled = true;
  cameraTorchButton.setAttribute("aria-pressed", "false");
  cameraTorchButton.classList.remove("btn-warning");
  cameraTorchButton.classList.add("btn-outline-secondary");
  cameraTorchButton.querySelector("span").textContent = "{% trans 'Zaklamp: uit' %}";
  cameraPanel.closest(".radio-selector-shell")?.classList.remove("radio-selector-camera-mode");
  cameraPanel.style.display = "none";
  if (canShowCameraScanner()) {
    cameraButton.style.display = "inline-flex";
  }
}

cameraTorchButton.addEventListener("click", async () => {
  if (typeof cameraControls?.switchTorch !== "function") return;
  const nextState = !cameraTorchEnabled;
  try {
    await cameraControls.switchTorch(nextState);
    cameraTorchEnabled = nextState;
    cameraTorchButton.setAttribute("aria-pressed", String(nextState));
    cameraTorchButton.classList.toggle("btn-warning", nextState);
    cameraTorchButton.classList.toggle("btn-outline-secondary", !nextState);
    cameraTorchButton.querySelector("span").textContent = nextState
      ? "{% trans 'Zaklamp: aan' %}"
      : "{% trans 'Zaklamp: uit' %}";
  } catch (err) {
    console.error(err);
    cameraTorchButton.disabled = true;
    setSelectorError("{% trans 'Zaklamp wordt niet ondersteund door deze camera.' %}");
  }
});

async function submitScannedLine(scannedLine) {
  const res = await fetch("{% url 'radio:scan' %}", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ scanned_line: scannedLine }),
  });
  return res.json();
}

function handleScanResponse(data) {
  if (data.status === "ok" || data.status === "success") {
    stop_scanning();
    loadSelectorResult(data);
  } else {
    setSelectorError(data.message);
    start_scanning();
  }
}

// --- Load result ---
function loadSelectorResult(data) {
  if (autoConfirm && currentCallback) {
    stopCameraScanning();
    currentCallback(currentButton, data);
    modalElement && bootstrap.Modal.getInstance(modalElement)?.hide();
    return;
  }

  const resultUrlTemplate = "{% url 'radio:selector_result' pk=0 %}";
  const resultUrl = resultUrlTemplate.replace('0', data.TEI);

  inputsDiv.style.display = "none";
  resultDiv.style.display = "block";

  fetch(resultUrl)
    .then(res => res.text())
    .then(html => resultDiv.innerHTML = html)
    .catch(err => console.error("Fetch error:", err));
}

// --- Confirm/Cancel buttons ---
resultDiv.addEventListener("click", e => {
  if (e.target.id === "cancel-radio") {
    resetToInputs();
    start_scanning();
  } else if (e.target.id === "confirm-radio") {
    stopCameraScanning();
    if (currentCallback) currentCallback(currentButton, e.target.dataset);
    if (!isStatic && modalElement) bootstrap.Modal.getInstance(modalElement)?.hide();
  }
});
</script>
